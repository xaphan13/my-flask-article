{% extends "layout.html" %}

{% block content %}

  <h1 class="mb-4">Статьи</h1>

  <div class="list-group">
    {% for art in title_list %}
      <a class="list-group-item list-group-item-action art-card"
         href="{{ url_for('art_main.art_author', author=art.author, art_id=art.art_id) }}">
        <div class="d-flex w-100 justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-1 art-card__title">{{ art.title }}</h5>
          <div class="d-flex gap-2">
            <span class="badge text-bg-secondary">{{ art.lang }}</span>
            <span class="badge text-bg-info">{{ art.author }}</span>
          </div>
        </div>
        <small class="text-body-secondary">#{{ art.art_id }}</small>
      </a>
    {% endfor %}
  </div>

{% endblock content %}
